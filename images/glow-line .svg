<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2e3a"/>
      <stop offset="0.5" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>

    <linearGradient id="glow" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ccfbf1" stop-opacity="1"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
      <animate attributeName="x1" from="-300" to="1000" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0" to="1300" dur="1.5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="blur" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0" y="4.5" width="1000" height="3" rx="1.5" fill="url(#base)" opacity="0.7"/>
  <rect x="0" y="4" width="1000" height="4" fill="url(#glow)" filter="url(#blur)"/>
  <rect x="0" y="5" width="1000" height="2" fill="url(#glow)"/>
</svg>
